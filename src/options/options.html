<!DOCTYPE html>
<html>
<head>
  <title>Linzu Clean for X - Settings</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 20px; }
    h1 { font-size: 20px; }
    label { display: block; margin-bottom: 10px; }
    .status { color: green; display: none; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Filter Settings</h1>
  <div>
    <label>
      <input type="checkbox" id="zombie">
      Remove Impression Zombies
    </label>
    <label>
      <input type="checkbox" id="spam">
      Remove Promotion/Spam
    </label>
    <label>
      <input type="checkbox" id="toxic">
      Remove Toxic Content
    </label>
  </div>
  <div id="status" class="status">Options saved.</div>
  <script src="options.js"></script>
</body>
</html>
