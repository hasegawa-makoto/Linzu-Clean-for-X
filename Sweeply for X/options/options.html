<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title data-i18n="opt_title">Sweeply Settings</title>
  <link rel="stylesheet" href="options.css">
  <script src="../utils/i18n.js"></script>
  <script src="../utils/license.js"></script>
  <script src="options.js"></script>
</head>
<body>
  <div class="container">
    <h1 data-i18n="opt_title">Sweeply Settings</h1>

    <!-- UI Language Selector -->
    <div class="language-selector" style="text-align:right; margin-bottom:10px;">
        <label for="ui-language" data-i18n="opt_ui_lang">UI Language:</label>
        <select id="ui-language">
            <option value="ja">日本語</option>
            <option value="en">English</option>
        </select>
    </div>

    <!-- License Section -->
    <div class="section license-box">
        <h2 data-i18n="opt_license_title">Pro License</h2>
        <p data-i18n="opt_license_desc">Enter your license key to unlock full features.</p>
        <input type="text" id="license-key" class="license-input" placeholder="LINZU-PRO-XXXX-XXXX">
        <button id="activate-btn" class="license-btn" data-i18n="opt_activate">Activate</button>
        <span id="license-msg" class="status-msg"></span>
        <div style="margin-top:10px;">
            <a id="opt-get-license-link" href="#" target="_blank" style="color:#1DA1F2; font-size:12px; text-decoration:none;" data-i18n="ui_get_license">Get a License key</a>
        </div>
    </div>

    <!-- General Settings -->
    <div class="section">
      <h2 data-i18n="opt_general_title">General</h2>

      <!-- Content Language Filter -->
      <div class="control-group">
          <label data-i18n="opt_content_lang" style="font-weight:bold; display:block; margin-bottom:5px;">Keep Content Language:</label>
          <select id="filter-language">
              <option value="all" data-i18n="opt_lang_all">All</option>
              <option value="ja" data-i18n="opt_lang_ja">Japanese Only</option>
              <option value="en" data-i18n="opt_lang_en">English Only</option>
          </select>
      </div>

      <div class="checkbox-group" style="margin-top:10px;">
        <!-- Split Duplicates -->
        <label>
          <input type="checkbox" id="filter-duplicate-content"> <span data-i18n="opt_duplicate_content">Content: Hide identical text (Keep oldest)</span>
        </label>
        <label>
          <input type="checkbox" id="filter-user-spam"> <span data-i18n="opt_user_spam">User Spam: Hide 2nd+ reply from same user</span>
        </label>

        <label>
          <input type="checkbox" id="filter-unverified"> <span data-i18n="opt_unverified_title">Hide Unverified Accounts</span>
        </label>
      </div>
    </div>

    <!-- Content Settings -->
    <div class="section">
      <h2 data-i18n="opt_content_title">Content Restrictions</h2>
      <div class="checkbox-group">
        <label>
            <input type="checkbox" id="content-image-only"> <span data-i18n="opt_content_img">Hide Image Only</span>
        </label>
        <label>
            <input type="checkbox" id="content-short"> <span data-i18n="opt_content_short">Hide Short Posts</span>
        </label>
        <label>
            <input type="checkbox" id="content-links"> <span data-i18n="opt_content_links">Hide Excessive Links</span>
        </label>
      </div>
    </div>

    <!-- Bot Settings -->
    <div class="section">
      <h2 data-i18n="opt_bot_title">Bot Detection</h2>
      <div class="checkbox-group">
        <label>
            <input type="checkbox" id="bot-digits"> <span data-i18n="opt_bot_digits">Hide ID with Digits</span>
        </label>
        <label>
            <input type="checkbox" id="bot-icon"> <span data-i18n="opt_bot_default_icon">Hide Default Icon</span>
        </label>
        <label>
            <input type="checkbox" id="bot-emoji"> <span data-i18n="opt_bot_emoji">Hide Emoji Only</span>
        </label>
        <label>
            <input type="checkbox" id="bot-links"> <span data-i18n="opt_bot_links">Hide External Links</span>
        </label>
      </div>
    </div>

    <!-- Keywords -->
    <div class="section">
      <h2 data-i18n="opt_keywords_title">Custom Keywords</h2>
      <textarea id="custom-keywords" rows="5" style="width:100%;" data-i18n-placeholder="opt_keywords_placeholder"></textarea>
    </div>

    <div class="save-section">
      <button id="save-btn" class="primary-btn" data-i18n="opt_save">Save Settings</button>
      <span id="status-msg" class="status-msg"></span>
    </div>
  </div>
</body>
</html>
