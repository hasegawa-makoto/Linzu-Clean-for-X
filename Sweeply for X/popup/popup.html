<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
  <title>Sweeply</title>
</head>
<body>
  <div class="container">
    <h1 data-i18n="appTitle">Sweeply for X</h1>
    <div class="status-container">
      <span class="status-label" data-i18n="popup_status">Status:</span>
      <span id="status-value" class="status-value status-active">Active</span>
    </div>
    <div class="license-status-container">
      <span id="license-status" class="license-status">Unlicensed</span>
    </div>
    <button id="toggle-btn" class="primary-btn" data-i18n="ui_switch_label">Toggle</button>
    <button id="settings-btn" class="secondary-btn" data-i18n="ui_settings">Settings</button>
  </div>
  <script src="../utils/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
